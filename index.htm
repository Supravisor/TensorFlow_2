  <h1>TensorFlow Core Learning Algorithms</h1>

  <form name="editor">
    <table>
      <tbody>
        <tr>
          <td id="buttons">
<div>
  <h2>Linear regression</h2>

  <p>
    <input type="button" class="btn btn-module" value="modules" onclick="document.editor.textbox.value+='\nimport matplotlib.pyplot as plt\nimport numpy as np\nimport pandas as pd\nimport tensorflow as tf\nfrom tensorflow.keras import layers\n'" />
    <input type="button" class="btn btn-success" value="sample dataset" onclick="document.editor.textbox.value+='\nx = [1, 2, 3, 4, 5]\ny = [1, 3, 8, 10, 14]\nplt.plot(x, y, \'ro\')\nplt.axis([0, 6, 0, 15])\nx_unique = np.unique(x)\npoly_func = np.poly1d(np.polyfit(x, y, 1))\nplt.plot(x_unique, poly_func(x_unique))\nplt.show()\n'" />
    <input type="button" class="btn btn-success" value="load dataset" onclick="document.editor.textbox.value+='\n# 1. Load data\ndftrain = pd.read_csv(\'https://raw.githubusercontent.com/Supravisor/TensorFlow_2/refs/heads/project/datasets/train.csv\')\ndfeval = pd.read_csv(\'https://raw.githubusercontent.com/Supravisor/TensorFlow_2/refs/heads/project/datasets/eval.csv\')\ny_train = dftrain.pop(\'survived\')\ny_eval = dfeval.pop(\'survived\')\n'" />
    <input type="button" class="btn btn-success" value="convert DataFrame" onclick="document.editor.textbox.value+='\n# 2. Convert DataFrames directly into standard tf.data.Dataset pipelines\ndef dataframe_to_dataset(dataframe, labels, shuffle=True, batch_size=32):\n    df = dataframe.copy()\n    # Convert dataframe into a dictionary of tensors matching column names\n    ds = tf.data.Dataset.from_tensor_slices((dict(df), labels))\n    if shuffle:\n        ds = ds.shuffle(buffer_size=len(df))\n    ds = ds.batch(batch_size, drop_remainder=True)\n    return ds.prefetch(tf.data.AUTOTUNE)\n\n# Convert a Pandas DataFrame into a tf.data.Dataset object\ntrain_ds = dataframe_to_dataset(dftrain, y_train, shuffle=True, batch_size=32)\neval_ds = dataframe_to_dataset(dfeval, y_eval, shuffle=False, batch_size=32)\n'">
  </p>

  <p>
    <input type="button" class="btn btn-success" value="build inputs" onclick="document.editor.textbox.value+='\n# 3. Build inputs and dynamic Keras preprocessing layers\nall_inputs = {}\nencoded_features = []\n'" />
  </p>

  <p>
    <input type="button" class="btn btn-success" value="list of features" onclick="document.editor.textbox.value+='\nCATEGORICAL_COLUMNS = [\'sex\', \'n_siblings_spouses\',\n    \'parch\', \'class\', \'deck\',\n    \'embark_town\', \'alone\']\n\nNUMERIC_COLUMNS = [\'age\', \'fare\']\n\nfeature_columns = []\nfor feature_name in CATEGORICAL_COLUMNS:\n    vocabulary = dftrain[feature_name].unique()  # gets a list of all unique values from given feature column\n    feature_columns.append(tf.feature_column.categorical_column_with_vocabulary_list(feature_name, vocabulary))\n\nfor feature_name in NUMERIC_COLUMNS:\n    feature_columns.append(tf.feature_column.numeric_column(feature_name, dtype=tf.float32))\n'" />
    <input type="button" class="btn btn-success" value="input function" onclick="document.editor.textbox.value+='\ndef make_input_fn(data_df, label_df, num_epochs=10, shuffle=True, batch_size=32):\n    def input_function():\n        ds = tf.data.Dataset.from_tensor_slices((dict(data_df), label_df))\n        if shuffle:\n            ds = ds.shuffle(1000)\n        ds = ds.batch(batch_size).repeat(num_epochs)\n        return ds\n    return input_function\n\ntrain_input_fn = make_input_fn(dftrain, y_train)\neval_input_fn = make_input_fn(dfeval, y_eval, num_epochs=1, shuffle=False)\n'" />
    <input type="button" class="btn btn-success" value="linear estimator" onclick="document.editor.textbox.value+='\nlinear_est = tf.estimator.LinearClassifier(feature_columns=feature_columns)\n\n# Define column types explicitly based on data types\nCATEGORICAL_STRING_COLUMNS = ['sex', 'class', 'deck', 'embark_town', 'alone']\nCATEGORICAL_INT_COLUMNS = ['n_siblings_spouses', 'parch']\nNUMERIC_COLUMNS = ['age', 'fare']\n'" />
  </p>

  <p>
    <input type="button" class="btn btn-success" value="train model" onclick="document.editor.textbox.value+='\nlinear_est.train(train_input_fn)\nresult = linear_est.evaluate(eval_input_fn)\nprint(result[\'accuracy\'])\n'" />
    <input type="button" class="btn btn-success" value="prediction" onclick="document.editor.textbox.value+='\npred_dicts = list(linear_est.predict(eval_input_fn))\nprobs = pd.Series([pred[\'probabilities\'][1] for pred in pred_dicts])\n\nprobs.plot(kind=\'hist\', bins=20, title=\'predicted probabilities\')\n\nprint(pred_dicts[0][\'probabilities\'])\nprint(dfeval.loc[0])\nprint(y_eval.loc[0])\n'" />
  </p>

  </p>
