          <td id="buttons">
<div>
  <h2>Linear regression</h2>

  <p>
    <input type="button" class="btn btn-module" value="modules" onclick="document.editor.textbox.value+='\nimport matplotlib.pyplot as plt\nimport numpy as np\nimport pandas as pd\nimport tensorflow as tf\nfrom tensorflow.keras import layers\n'" />
    <input type="button" class="btn btn-success" value="sample dataset" onclick="document.editor.textbox.value+='\nx = [1, 2, 3, 4, 5]\ny = [1, 3, 8, 10, 14]\nplt.plot(x, y, \'ro\')\nplt.axis([0, 6, 0, 15])\nx_unique = np.unique(x)\npoly_func = np.poly1d(np.polyfit(x, y, 1))\nplt.plot(x_unique, poly_func(x_unique))\nplt.show()\n'" />
    <input type="button" class="btn btn-success" value="load dataset" onclick="document.editor.textbox.value+='\n# 1. Load data\ndftrain = pd.read_csv(\'https://raw.githubusercontent.com/Supravisor/TensorFlow_2/refs/heads/project/linear_regression/train.csv\')\ndfeval = pd.read_csv(\'https://raw.githubusercontent.com/Supravisor/TensorFlow_2/refs/heads/project/linear_regression/eval.csv\')\ny_train = dftrain.pop(\'survived\')\ny_eval = dfeval.pop(\'survived\')\n'" />
    <input type="button" class="btn btn-success" value="convert DataFrame" onclick="document.editor.textbox.value+='\n# 2. Convert DataFrames directly into standard tf.data.Dataset pipelines\ndef dataframe_to_dataset(dataframe, labels, shuffle=True, batch_size=32):\n    df = dataframe.copy()\n    # Convert dataframe into a dictionary of tensors matching column names\n    ds = tf.data.Dataset.from_tensor_slices((dict(df), labels))\n    if shuffle:\n        ds = ds.shuffle(buffer_size=len(df))\n    ds = ds.batch(batch_size, drop_remainder=True)\n    return ds.prefetch(tf.data.AUTOTUNE)\n\n# Convert a Pandas DataFrame into a tf.data.Dataset object\ntrain_ds = dataframe_to_dataset(dftrain, y_train, shuffle=True, batch_size=32)\neval_ds = dataframe_to_dataset(dfeval, y_eval, shuffle=False, batch_size=32)\n'">
  </p>

  <p>
    <input type="button" class="btn btn-success" value="build inputs" onclick="document.editor.textbox.value+='\n# 3. Build inputs and dynamic Keras preprocessing layers\nall_inputs = {}\nencoded_features = []\n\n# Define column types explicitly based on data types\nCATEGORICAL_STRING_COLUMNS = [\'sex\', \'class\', \'deck\', \'embark_town\', \'alone\']\nCATEGORICAL_INT_COLUMNS = [\'n_siblings_spouses\', \'parch\']\nNUMERIC_COLUMNS = [\'age\', \'fare\']\n\n# Process numeric features (normalisation)\nfor header in NUMERIC_COLUMNS:\n    numeric_col = layers.Input(shape=(1,), name=header, dtype=tf.float32)\n    all_inputs[header] = numeric_col\n\n    # Dynamic data normalisation\n    normalizer = layers.Normalization(axis=None)\n\n    # Adapt to the training dataset feature values\n    feature_ds = train_ds.map(lambda x, y: x[header])\n    normalizer.adapt(feature_ds)\n\n    encoded_features.append(normalizer(numeric_col))\n\n# Process categorical string features (one-hot encoding via StringLookup)\nfor header in CATEGORICAL_STRING_COLUMNS:\n    string_col = layers.Input(shape=(1,), name=header, dtype=tf.string)\n    all_inputs[header] = string_col\n\n    # Integer indexing ==> One-hot encoding\n    indexer = layers.StringLookup(output_mode=\'one_hot\')\n    feature_ds = train_ds.map(lambda x, y: x[header])\n    indexer.adapt(feature_ds)\n\n    encoded_features.append(indexer(string_col))\n\n# Process categorical integer features (One-hot encoding via IntegerLookup)\nfor header in CATEGORICAL_INT_COLUMNS:\n    int_col = layers.Input(shape=(1,), name=header, dtype=tf.int64)\n    all_inputs[header] = int_col\n\n    # Integer indexing ==> One-hot encoding\n    indexer = layers.IntegerLookup(output_mode=\'one_hot\')\n    feature_ds = train_ds.map(lambda x, y: x[header])\n    indexer.adapt(feature_ds)\n\n    encoded_features.append(indexer(int_col))\n'" />
    <input type="button" class="btn btn-success" value="define and compile model" onclick="document.editor.textbox.value+='\n# 4. Define and compile the Functional Keras model\nall_features = layers.concatenate(encoded_features)\nx = layers.Dense(32, activation=\'relu\')(all_features)\nx = layers.Dropout(0.2)(x)\noutput = layers.Dense(1, activation=\'sigmoid\')(x)\n\n# Define the model\nmodel = tf.keras.Model(inputs=all_inputs, outputs=output)\n# Compile the model\nmodel.compile(\n    optimizer=\'adam\',\n    loss=\'binary_crossentropy\',\n    metrics=[\'accuracy\']\n)\n'" />
    <input type="button" class="btn btn-success" value="train and evaluate" onclick="document.editor.textbox.value+='\n# 5. Train and evaluate\nmodel.fit(train_ds, epochs=10, shuffle=False)\nloss, accuracy = model.evaluate(eval_ds)\nprint(f\'Evaluation Accuracy: {accuracy:.4f}\')\n'" />
  </p>

  <hr />
  <h2>Classification</h2>

  <p>
    <input type="button" class="btn btn-module" value="modules" onclick="document.editor.textbox.value+='\nimport tensorflow as tf\nimport pandas as pd\nimport numpy as np\n'" />
    <input type="button" class="btn btn-success" value="define names and categories" onclick="document.editor.textbox.value+='\n# Define names and categories\nCSV_COLUMN_NAMES = ['SepalLength', 'SepalWidth', 'PetalLength', 'PetalWidth', 'Species']\nSPECIES = ['Setosa', 'Versicolor', 'Virginica']\n'" />
    <input type="button" class="btn btn-success" value="download datasets" onclick="document.editor.textbox.value+='\n# Download datasets\ntrain_path = tf.keras.utils.get_file(\'iris_training.csv\', \'https://raw.githubusercontent.com/Supravisor/TensorFlow_2/refs/heads/main/classification/\')\ntest_path = tf.keras.utils.get_file(\'iris_test.csv\', \'https://raw.githubusercontent.com/Supravisor/TensorFlow_2/refs/heads/main/classification/\')\n'" />
    <input type="button" class="btn btn-success" value="load datasets" onclick="document.editor.textbox.value+='\n# Load dataset into Pandas DataFrames\ntrain = pd.read_csv(train_path, names=CSV_COLUMN_NAMES, header=0)\ntest = pd.read_csv(test_path, names=CSV_COLUMN_NAMES, header=0)\n'" />
    <input type="button" class="btn btn-success" value="separate features from labels" onclick="document.editor.textbox.value+='\n# Separate features from labels\ntrain_y = train.pop(\'Species\')\ntest_y = test.pop(\'Species\')\n'" />
    <input type="button" class="btn btn-success" value="build neural network" onclick="document.editor.textbox.value+='\n# Build the Keras Neural Network\nmodel = tf.keras.Sequential([\n    tf.keras.layers.Input(shape=(4,)),             # 4 input features\n    tf.keras.layers.Dense(30, activation=\'relu\'),  # First hidden layer (30 units)\n    tf.keras.layers.Dense(10, activation=\'relu\'),  # Second hidden layer (10 units)\n    tf.keras.layers.Dense(3, activation=\'softmax\') # Output layer (3 classes)\n])\n'" />
    <input type="button" class="btn btn-success" value="compile model" onclick="document.editor.textbox.value+='\n# Compile the model\n
model.compile(\n    optimizer='adam',\n    loss='sparse_categorical_crossentropy',\n    metrics=['accuracy']\n)\n'" />
  </p>
