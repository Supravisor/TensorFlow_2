  <p>
    <input type="button" class="btn btn-module" value="modules" onclick="document.editor.textbox.value+='\nfrom __future__ import absolute_import, division, print_function, unicode_literals\nimport matplotlib.pyplot as plt\nimport numpy as np\nimport pandas as pd\nfrom IPython.display import clear_output\nfrom six.moves import urllib\nimport tensorflow.compat.v2.feature_column as fc\nimport tensorflow as tf\n'" />

    <input type="button" class="btn btn-success" value="load dataset" onclick="document.editor.textbox.value+='\ndftrain = pd.read_csv(\'https://raw.githubusercontent.com/Supravisor/TensorFlow_2/refs/heads/project/datasets/train.csv\') # training data\ndfeval = pd.read_csv(\'https://raw.githubusercontent.com/Supravisor/TensorFlow_2/refs/heads/project/datasets/eval.csv\') # testing data\ny_train = dftrain.pop(\'survived\')\ny_eval = dfeval.pop(\'survived\')\n'" />
  </p>

  <p>
    <input type="button" class="btn btn-success" value="age" onclick="document.editor.textbox.value+='\ndftrain.age.hist(bins=20)\n'" />
    <input type="button" class="btn btn-success" value="gender" onclick="document.editor.textbox.value+='\ndftrain.sex.value_counts().plot(kind=\'barh\')\n'" />
    <input type="button" class="btn btn-success" value="class" onclick="document.editor.textbox.value+='\ndftrain[\'class\'].value_counts().plot(kind=\'barh\')\n'" />
    <input type="button" class="btn btn-success" value="stats" onclick="document.editor.textbox.value+='\npd.concat([dftrain, y_train], axis=1).groupby(\'sex\').survived.mean().plot(kind=\'barh\').set_xlabel(\'% survive\')\n'" />
  </p>

  <p>
    <input type="button" class="btn btn-success" value="list of features" onclick="document.editor.textbox.value+='\nCATEGORICAL_COLUMNS = [\'sex\', \'n_siblings_spouses\',\n    \'parch\', \'class\', \'deck\',\n    \'embark_town\', \'alone\']\n\nNUMERIC_COLUMNS = [\'age\', \'fare\']\n\nfeature_columns = []\nfor feature_name in CATEGORICAL_COLUMNS:\n    vocabulary = dftrain[feature_name].unique()  # gets a list of all unique values from given feature column\n    feature_columns.append(tf.feature_column.categorical_column_with_vocabulary_list(feature_name, vocabulary))\n\nfor feature_name in NUMERIC_COLUMNS:\n    feature_columns.append(tf.feature_column.numeric_column(feature_name, dtype=tf.float32))\n'" />
